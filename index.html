<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N回目のおつかい-TOP</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="outer">
        <div class="device-frame">
            <main class="screen">

                <!-- LINE風エリア -->
                <section class="chat" id="chat">
                    <!-- JSでメッセージ追加 -->
                </section>
                <div class="scroll-indicator" id="scrollIndicator">▼</div>

                <!-- 本文 -->
                <section class="content">
                    <h1>Webノベルゲーム<br><img class="logo" src="./img/logo2.png" alt="N回目のおつかい"></h1>

                    <p class="summary">
                        足りない夕飯の材料を買いにショッピングセンターへやってきたあなた。<br>
                        暇を持て余していた「ユウジン」にせがまれ、ビデオ通話をしながら買い物をすることに。<br>
                        ただ、この店、何かがおかしい……？
                    </p>

                    <p class="notice">
                        ※本作品には軽度のホラー・不穏表現が含まれます。<br>
                        苦手な方はご注意ください。
                    </p>
                    <p class="notice">
                        ※シークレットウィンドでのプレイは非推奨です</p>
                    <p class="notice">
                        ※このゲームはオートセーブです。ブラウザを閉じる、リロードをするなどしても進捗は保存されます
                    </p>
                    <p class="notice">
                        ※横画面でのプレイを推奨します
                    </p>
                </section>

                <!-- 固定ボタン -->
                <div class="bottom">
                    <a href="./game" class="start-btn">電話にでてあげる</a>
                </div>

            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
