<!DOCTYPE html>
<html lang="ja">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N回目のおつかい-TOP</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="outer">
        <div class="device-frame">
            <main class="screen">

                <!-- LINE風エリア -->
                <section class="chat" id="chat">
                    <!-- JSでメッセージ追加 -->
                </section>
                <div class="scroll-indicator" id="scrollIndicator">▼</div>

                <!-- 本文 -->
                <section class="content">
                    <h1>Webノベルゲーム<br>N回目のおつかい</h1>

                    <p class="summary">
                        これは、何度も繰り返される“おつかい”の物語。<br>
                        ほんの少しの違和感と、小さな選択が、やがて大きな分岐を生む。
                    </p>

                    <p class="notice">
                        ※本作品には軽度のホラー・不穏表現が含まれます。<br>
                        苦手な方はご注意ください。
                    </p>
                    <p class="notice">
                        ※本作品には軽度のホラー・不穏表現が含まれます。<br>
                        苦手な方はご注意ください。
                    </p>
                </section>

                <!-- 固定ボタン -->
                <div class="bottom">
                    <a href="./game" class="start-btn">電話にでてあげる</a>
                </div>

            </main>
        </div>
    </div>

    <script src="script.js"></script>

</html>
